name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    # The core must install and work WITHOUT the charts extra — that is the
    # whole point of making Plotly/Kaleido optional. If this job needs plotly,
    # the dependency has leaked into the core.
    name: core (no charts extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Fail if plotly is importable
        run: |
          python - <<'PY'
          import importlib.util, sys
          if importlib.util.find_spec("plotly") is not None:
              sys.exit("plotly is installed in the core job — the extra leaked")
          PY
      - run: python -c "import reportkit; print(reportkit.__version__)"
      - run: pytest -q -m "not charts"

  full:
    name: full (with charts extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,charts]"
      - run: pytest -q
